{% extends "base.html" %}

{% block content %}
  <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-12 col-md-6 col-lg-5">
      <div class="card border-0 shadow p-4 text-center">
        <div class="icon icon-shape icon-lg bg-soft-danger text-danger rounded-circle mx-auto mb-4">
          <svg class="icon icon-md" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path>
          </svg>
        </div>

        <h1 class="h4 mb-3">Delete Task?</h1>
        <p class="text-gray-600 mb-4">
          Are you sure you want to permanently delete the task <strong>"{{ object.name }}"</strong>? This action cannot be undone.
        </p>

        <form action="" method="post">
          {% csrf_token %}

          <div class="d-flex justify-content-center">
            {% url 'task:task-list' as task_list_url %}
            <a class="btn btn-light text-gray-600 me-2" href="{{ request.GET.next|default:task_list_url }}">
              Cancel
            </a>
            <button type="submit" class="btn btn-danger">
              Yes, Delete
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
